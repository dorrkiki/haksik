<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>오늘의 학식</title>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#eaf3ee; --panel:#ffffff; --ink:#17332a; --muted:#5f7a70; --line:#cfe1d8;
  --pri:#1f7a57; --priInk:#ffffff; --hl:#fff3c4;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f1f19; --panel:#172c24; --ink:#e6f4ec; --muted:#93b3a4; --line:#274539;
    --pri:#4cc38d; --priInk:#0b1a13; --hl:#3d3a1a;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1f19; --panel:#172c24; --ink:#e6f4ec; --muted:#93b3a4; --line:#274539;
  --pri:#4cc38d; --priInk:#0b1a13; --hl:#3d3a1a;
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);
  font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  display:flex;justify-content:center;padding:20px 14px}
main{width:100%;max-width:560px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:14px}
h1{margin:0;font-size:1.5rem}
.week{display:flex;align-items:center;gap:6px;font-size:.9rem;color:var(--muted)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
.nav{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);background:var(--panel)}
.nav:hover{border-color:var(--pri)}
.days,.meals{display:grid;gap:6px;margin-bottom:12px}
.days{grid-template-columns:repeat(5,1fr)}
.meals{grid-template-columns:repeat(3,1fr)}
.tab{padding:10px 4px;border-radius:12px;border:2px solid var(--line);background:var(--panel);line-height:1.3}
.tab small{display:block;color:var(--muted);font-size:.78rem}
.tab[aria-selected="true"]{background:var(--pri);border-color:var(--pri);color:var(--priInk)}
.tab[aria-selected="true"] small{color:inherit;opacity:.85}
.tab.today:not([aria-selected="true"]){border-color:var(--pri)}
.info{display:flex;justify-content:space-between;color:var(--muted);font-size:.9rem;margin:4px 2px 10px}
.now{background:var(--hl);color:var(--ink);padding:2px 8px;border-radius:99px;font-size:.8rem}
.corner{background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:10px}
.corner-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.corner-h b{font-size:1.05rem}
.price{color:var(--pri);font-weight:700}
.corner ul{margin:0;padding-left:18px;line-height:1.75}
.empty{background:var(--panel);border:2px dashed var(--line);border-radius:16px;padding:32px 16px;text-align:center;color:var(--muted)}
.note{font-size:.8rem;color:var(--muted);margin-top:14px;text-align:center}
</style>
</head>
<body>
<main>
  <header>
    <h1>오늘의 학식</h1>
    <div class="week">
      <button class="nav" id="prev" aria-label="지난주">‹</button>
      <span id="range"></span>
      <button class="nav" id="next" aria-label="다음주">›</button>
    </div>
  </header>
  <div class="days" id="days" role="tablist" aria-label="요일"></div>
  <div class="meals" id="meals" role="tablist" aria-label="식사 시간"></div>
  <div class="info"><span id="place"></span><span id="hours"></span></div>
  <div id="list"></div>
  <p class="note">※ 예시 메뉴입니다. 아래 스크립트의 CORNERS 데이터를 실제 메뉴로 바꿔 쓰세요.</p>
</main>
<script>
// ── 메뉴 데이터: 여기를 실제 메뉴로 교체하세요 ──
const MEALS=[
  {key:'b',label:'조식',hours:'08:00–09:30',from:8*60,to:9.5*60,place:'학생식당 1층'},
  {key:'l',label:'중식',hours:'11:30–14:00',from:11.5*60,to:14*60,place:'학생식당 1층 · 2층'},
  {key:'d',label:'석식',hours:'17:00–18:30',from:17*60,to:18.5*60,place:'학생식당 1층'}
];
// 요일(월~금)별 메뉴. 코너마다 이름·가격·반찬 목록.
const CORNERS={
  b:[ // 조식
    [{n:'천원의 아침',p:1000,m:['계란볶음밥','미소국','김치','우유']}],
    [{n:'천원의 아침',p:1000,m:['토스트','스크램블','샐러드','우유']}],
    [{n:'천원의 아침',p:1000,m:['주먹밥','유부국','단무지','요구르트']}],
    [{n:'천원의 아침',p:1000,m:['샌드위치','수프','과일','우유']}],
    [{n:'천원의 아침',p:1000,m:['죽','장아찌','김','우유']}]
  ],
  l:[ // 중식
    [{n:'한식',p:5500,m:['제육볶음','쌀밥','콩나물국','깍두기','계란찜']},{n:'일품',p:6500,m:['치킨마요덮밥','미니우동','단무지']},{n:'분식',p:4500,m:['떡볶이','김밥','어묵국물']}],
    [{n:'한식',p:5500,m:['된장찌개','쌀밥','고등어구이','시금치나물','김치']},{n:'일품',p:6500,m:['돈까스','샐러드','크림수프']},{n:'분식',p:4500,m:['라볶이','주먹밥','단무지']}],
    [{n:'한식',p:5500,m:['닭갈비','쌀밥','미역국','오이무침','김치']},{n:'일품',p:6500,m:['카레라이스','미니샐러드','피클']},{n:'분식',p:4500,m:['쫄면','유부초밥','어묵국물']}],
    [{n:'한식',p:5500,m:['불고기','쌀밥','북어국','감자조림','김치']},{n:'일품',p:6500,m:['오므라이스','콘샐러드','미소국']},{n:'분식',p:4500,m:['우동','참치김밥','단무지']}],
    [{n:'한식',p:5500,m:['순두부찌개','쌀밥','계란말이','멸치볶음','김치']},{n:'일품',p:6500,m:['짜장밥','군만두','단무지']},{n:'분식',p:4500,m:['떡라면','계란밥','김치']}]
  ],
  d:[ // 석식
    [{n:'한식',p:5500,m:['제육덮밥','콩나물국','깍두기']}],
    [{n:'한식',p:5500,m:['김치찌개','쌀밥','두부부침','나물']}],
    [{n:'한식',p:5500,m:['치킨까스','쌀밥','미소국','양배추샐러드']}],
    [{n:'한식',p:5500,m:['갈비탕','쌀밥','잡채','김치']}],
    [{n:'한식',p:5500,m:['비빔밥','어묵국','장아찌']}]
  ]
};

const DOW=['월','화','수','목','금'];
const $=id=>document.getElementById(id);
const today=new Date();
let weekOffset=0,dayIdx=0,mealKey='l';

function mondayOf(off){
  const d=new Date(today);
  const dow=d.getDay(); // 0=일
  d.setDate(d.getDate()-(dow===0?6:dow-1)+off*7);
  d.setHours(0,0,0,0);return d;
}
const sameDay=(a,b)=>a.toDateString()===b.toDateString();
const fmt=d=>`${d.getMonth()+1}/${d.getDate()}`;

function initSelection(){
  const dow=today.getDay();
  dayIdx=(dow>=1&&dow<=5)?dow-1:0;
  const m=today.getHours()*60+today.getMinutes();
  mealKey=m<9.5*60?'b':m<14*60?'l':m<18.5*60?'d':'l';
  if(dow===0||dow===6)mealKey='l';
}

function render(){
  const mon=mondayOf(weekOffset);
  const fri=new Date(mon);fri.setDate(mon.getDate()+4);
  $('range').textContent=`${fmt(mon)} – ${fmt(fri)}`;

  $('days').innerHTML='';
  DOW.forEach((w,i)=>{
    const d=new Date(mon);d.setDate(mon.getDate()+i);
    const b=document.createElement('button');
    b.className='tab'+(sameDay(d,today)?' today':'');
    b.setAttribute('role','tab');b.setAttribute('aria-selected',i===dayIdx);
    b.innerHTML=`${w}<small>${fmt(d)}</small>`;
    b.onclick=()=>{dayIdx=i;render()};
    $('days').appendChild(b);
  });

  $('meals').innerHTML='';
  MEALS.forEach(m=>{
    const b=document.createElement('button');
    b.className='tab';b.setAttribute('role','tab');b.setAttribute('aria-selected',m.key===mealKey);
    b.innerHTML=`${m.label}<small>${m.hours}</small>`;
    b.onclick=()=>{mealKey=m.key;render()};
    $('meals').appendChild(b);
  });

  const meal=MEALS.find(m=>m.key===mealKey);
  const date=new Date(mon);date.setDate(mon.getDate()+dayIdx);
  const nowMin=today.getHours()*60+today.getMinutes();
  const live=sameDay(date,today)&&nowMin>=meal.from&&nowMin<=meal.to;
  $('place').textContent=meal.place;
  $('hours').innerHTML=live?'<span class="now">지금 운영 중</span>':meal.hours;

  // 주마다 코너 순서를 살짝 돌려 다른 메뉴처럼 보이게 하지 않고, 데이터를 그대로 보여줍니다.
  const corners=CORNERS[mealKey][dayIdx];
  $('list').innerHTML=corners&&corners.length
    ? corners.map(c=>`<section class="corner"><div class="corner-h"><b>${c.n}</b><span class="price">${c.p.toLocaleString('ko-KR')}원</span></div><ul>${c.m.map(x=>`<li>${x}</li>`).join('')}</ul></section>`).join('')
    : '<div class="empty">등록된 메뉴가 없습니다.</div>';
}

$('prev').onclick=()=>{weekOffset--;render()};
$('next').onclick=()=>{weekOffset++;render()};
initSelection();render();
</script>
</body>
</html>
